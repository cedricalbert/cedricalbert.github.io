project:
  type: website
  output-dir: docs

execute:
  freeze: auto        # re-run R code only when a page's source changes

website:
  title: "Climate Change and Forest Ecosystems Lab"
  favicon: images/CCFELOGO_025x025.png
  page-navigation: false
  navbar:
    title: "CCFE Lab"
    logo: images/CCFELOGO_025x025.png
    logo-alt: "CCFE Lab logo"
    left:
      - href: research.qmd
        text: Research
      - href: team.qmd
        text: People
      - href: publications.qmd
        text: Publications
      - href: collab.qmd
        text: Partners
      - href: lectures.qmd
        text: Teaching
      - href: join.qmd
        text: Join the lab
    right:
      - icon: envelope
        href: mailto:cedric.albert@umoncton.ca
        aria-label: Email
  page-footer:
    left: "Climate Change and Forest Ecosystems Lab · École de foresterie, Université de Moncton, Edmundston, NB"
    right:
      - icon: envelope
        href: mailto:cedric.albert@umoncton.ca
        aria-label: Email

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    # R code and output
    code-fold: true
    code-summary: "Show code"
    code-copy: true
    highlight-style: github
    fig-align: center
    fig-dpi: 150
